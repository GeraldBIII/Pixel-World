<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1430">
<title>Fernhollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="Fernhollow game world"></canvas>

<div id="hud" class="hidden">
  <div id="clock">
    <div class="date" id="clock-date"></div>
    <div class="row"><span id="clock-time"></span><span id="gold"></span></div>
    <div class="bar-l"><span title="Energy">⚡</span><div class="bar"><i id="en-bar"></i></div></div>
    <div class="bar-l"><span title="Health">♥</span><div class="bar hp"><i id="hp-bar"></i></div></div>
    <div class="bar-l"><span title="Stamina">»</span><div class="bar sta"><i id="sta-bar"></i></div></div>
    <div class="bar-l lvl"><b id="lv">Lv 1</b><div class="bar xp"><i id="xp-bar"></i></div></div>
    <div class="task" id="task"></div>
  </div>
  <button id="btn-pause" aria-label="Pause">❚❚</button>
  <div id="toasts"></div>
  <div id="itemname"></div>
  <div id="hotbar"></div>
  <div id="hint"></div>
</div>

<div id="touch">
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div id="tbtns">
    <button class="tbtn" id="tb-use" aria-label="Use item"><img id="tb-use-icon" class="px" alt=""><span>Use</span></button>
    <button class="tbtn" id="tb-atk" aria-label="Attack"><img id="tb-atk-icon" class="px" alt=""><span>Attack</span></button>
    <button class="tbtn" id="tb-act" aria-label="Interact"><span class="hand">✋</span><span id="tb-act-label">Act</span></button>
    <button class="tbtn" id="tb-roll" aria-label="Dive roll"><span class="big">↻</span><span>Roll</span></button>
    <button class="tbtn" id="tb-block" aria-label="Block"><span class="big">⛨</span><span>Block</span></button>
  </div>
  <div id="ttop">
    <button class="tbtn sq" id="tb-bag" aria-label="Inventory">Bag</button>
    <button class="tbtn sq" id="tb-map" aria-label="Map">Map</button>
  </div>
</div>

<div id="screens"></div>
<div id="fade"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
